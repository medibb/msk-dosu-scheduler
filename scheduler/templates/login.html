<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 도수치료 스케줄러</title>
  <style>
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#f3f4f6; }
    .card { background:#fff; padding:32px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); width:300px; }
    h1 { font-size:18px; margin:0 0 20px; text-align:center; }
    input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
    button { width:100%; margin-top:12px; padding:10px; background:#2563eb; color:#fff; border:0; border-radius:8px; font-size:15px; cursor:pointer; }
    .error { color:#dc2626; font-size:13px; margin-top:10px; text-align:center; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>🩺 도수치료 스케줄러</h1>
    <input type="password" name="password" placeholder="비밀번호" autofocus>
    <button type="submit">로그인</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
